<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Post or Pause? is a quick classroom game about law-office communication judgment."
    />
    <meta name="theme-color" content="#f3f0e9" />
    <title>Post or Pause?</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#game-main">Skip to game</a>

    <header class="app-header">
      <a class="brand" href="#" aria-label="Post or Pause home">
        <span>Post or Pause?</span>
      </a>
    </header>

    <main id="game-main" tabindex="-1">
      <section class="screen start-screen is-active" id="start-screen" aria-labelledby="start-title">
        <div class="start-copy">
          <h1 id="start-title">Post or<br /><span>Pause?</span></h1>
          <p class="intro">
            Law-office communication moves fast. Decide where the message belongs, who needs it,
            or whether it should be sent at all.
          </p>
          <button class="button button-primary" id="start-button" type="button">
            Start <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <section class="screen game-screen" id="game-screen" aria-labelledby="card-type">
        <div class="game-topline">
          <p class="round-count" id="round-count">1 of 10</p>
          <button class="text-button" id="quit-button" type="button">Start over</button>
        </div>

        <article class="message-card" id="message-card">
          <div class="card-heading">
            <h1 class="card-type" id="card-type">Where Does This Go?</h1>
          </div>

          <p class="scenario" id="scenario"></p>
        </article>

        <div class="answer-area">
          <div class="choices" id="choices" role="group" aria-label="Answer choices"></div>
        </div>

        <section class="feedback is-hidden" id="feedback" aria-live="polite" aria-labelledby="feedback-title">
          <div class="feedback-mark" id="feedback-mark" aria-hidden="true"></div>
          <div class="feedback-copy">
            <h2 id="feedback-title"></h2>
            <p id="feedback-text"></p>
          </div>
          <button class="button button-dark" id="next-button" type="button">
            Next <span aria-hidden="true">→</span>
          </button>
        </section>
      </section>

      <section class="screen results-screen" id="results-screen" aria-labelledby="results-title">
        <div class="results-copy">
          <h1 id="results-title"><span id="final-score">8 / 10</span><br />Correct Answers</h1>
          <p class="results-message" id="results-message"></p>
          <div class="results-actions">
            <button class="button button-primary" id="play-again-button" type="button">Play Again</button>
            <button class="button button-outline" id="review-button" type="button">Review Missed Cards</button>
          </div>
        </div>
      </section>

      <section class="screen review-screen" id="review-screen" aria-labelledby="review-title">
        <div class="review-header">
          <div>
            <h1 id="review-title">Missed calls</h1>
            <p id="review-summary"></p>
          </div>
          <button class="button button-primary" id="review-play-again-button" type="button">Play Again</button>
        </div>
        <div class="review-list" id="review-list"></div>
      </section>
    </main>

  </body>
</html>
